services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data/mosquitto_data:/mosquitto/data
      - ./data/mosquitto_log:/mosquitto/log
    environment:
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    entrypoint: >
      sh -c "rm -f /mosquitto/config/passwd &&
             mosquitto_passwd -c -b /mosquitto/config/passwd $$MQTT_USER $$MQTT_PASS &&
             chown mosquitto:mosquitto /mosquitto/config/passwd &&
             chmod 0700 /mosquitto/config/passwd &&
             exec mosquitto -c /mosquitto/config/mosquitto.conf"
    restart: unless-stopped

  influxdb:
    image: influxdb:2
    container_name: iot_influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./data/influxdb_data:/var/lib/influxdb2
    env_file:
      - .env
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=gestor
      - DOCKER_INFLUXDB_INIT_ORG=unimater
      - DOCKER_INFLUXDB_INIT_BUCKET=energia_salas
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: iot_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: iot_backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - MQTT_BROKER=mosquitto
      - REDIS_URL=redis://redis:6379
      - INFLUX_URL=http://influxdb:8086
    depends_on:
      - mosquitto
      - influxdb
      - redis
    restart: unless-stopped

